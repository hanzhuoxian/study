<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色扮演 Chatbot</title>
  <style>
    :root { color-scheme: light; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #26334b; background: #f2f4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 900px; margin: auto; }
    header, .row, .actions, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header { margin: 0 0 20px; }
    h1 { margin: 0; font-size: 25px; }
    header p { margin: 4px 0 0; color: #6c7890; font-size: 13px; }
    .status { border: 1px solid #dce2eb; border-radius: 20px; padding: 5px 11px; background: white; white-space: nowrap; font-size: 13px; }
    .panel { overflow: hidden; border: 1px solid #dce2eb; border-radius: 15px; background: white; box-shadow: 0 8px 30px #2438580a; }
    .settings { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto auto; align-items: end; gap: 10px; padding: 18px; border-bottom: 1px solid #e8ecf2; }
    label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; border: 1px solid #cfd7e3; border-radius: 8px; padding: 10px 11px; color: inherit; background: #fbfcfe; outline: none; }
    input:focus, textarea:focus { border-color: #486bd0; box-shadow: 0 0 0 3px #486bd018; }
    button { padding: 9px 14px; border: 1px solid #cfd7e3; border-radius: 8px; background: white; color: #384963; cursor: pointer; white-space: nowrap; }
    button.primary { border-color: #365ed1; background: #365ed1; color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .toolbar { padding: 12px 18px 8px; color: #6c7890; font-size: 13px; }
    .toolbar button { padding: 4px 9px; font-size: 12px; }
    #messages { height: min(52vh, 500px); min-height: 280px; overflow: auto; padding: 0 18px 18px; }
    .empty { display: grid; height: 100%; place-content: center; text-align: center; color: #778399; }
    .empty strong { color: #43516a; font-size: 17px; font-weight: 550; }
    .empty p { margin: 6px 0; font-size: 13px; }
    .message { margin-top: 15px; }
    .message.user { text-align: right; }
    .meta { display: flex; gap: 10px; margin-bottom: 5px; color: #778399; font-size: 12px; }
    .user .meta { justify-content: flex-end; }
    .bubble { display: inline-block; max-width: 88%; padding: 9px 13px; border-radius: 3px 12px 12px; background: #eff3fb; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
    .user .bubble { border-radius: 12px 3px 12px 12px; background: #e7edff; }
    .notice { margin: 12px 0; color: #778399; text-align: center; font-size: 12px; }
    .notice.error { color: #b54444; }
    .composer { padding: 16px 18px; border-top: 1px solid #e8ecf2; }
    textarea { min-height: 82px; resize: vertical; }
    .actions { margin-top: 9px; }
    .hint, footer { color: #778399; font-size: 12px; }
    footer { margin-top: 12px; text-align: center; }
    @media (max-width: 760px) { .settings { grid-template-columns: 1fr 1fr; } .settings .wide { grid-column: 1 / -1; } }
    @media (max-width: 480px) { body { padding: 18px 10px; } header { align-items: flex-start; } h1 { font-size: 21px; } .settings { padding: 13px; } #messages { padding: 0 13px 13px; } .composer { padding: 13px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>角色扮演 Chatbot</h1><p>连接网关，选择角色，开始一段对话。</p></div>
      <span id="status" class="status" role="status">未连接</span>
    </header>
    <section class="panel" aria-label="角色扮演聊天客户端">
      <form id="connection-form" class="settings">
        <div class="wide"><label for="url">WebSocket 地址</label><input id="url" type="url" value="ws://localhost:8080/ws" required spellcheck="false"></div>
        <div><label for="user-id">用户 ID</label><input id="user-id" value="guest" required></div>
        <div><label for="room-id">房间 ID</label><input id="room-id" value="room-1" required></div>
        <div><label for="character-id">角色 ID</label><input id="character-id" value="tsundere" required></div>
        <button id="connect" class="primary" type="submit">连接</button>
        <button id="disconnect" type="button" disabled>断开</button>
      </form>
      <div class="toolbar"><span>对话记录 · <span id="count">0</span></span><button id="clear" type="button">清空</button></div>
      <div id="messages" role="log" aria-live="polite" aria-relevant="additions"><div class="empty"><strong>还没有消息</strong><p>连接成功后即可开始聊天。</p></div></div>
      <form id="message-form" class="composer">
        <label for="content">发送给角色</label>
        <textarea id="content" placeholder="输入消息…" disabled></textarea>
        <div class="actions"><span class="hint">Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary" type="submit" disabled>发送</button></div>
      </form>
    </section>
    <footer>回复由服务端以 token 事件流式推送；浏览器自动处理 WebSocket Ping/Pong。</footer>
  </main>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const urlInput = $('#url'), userInput = $('#user-id'), roomInput = $('#room-id'), characterInput = $('#character-id');
    const connectButton = $('#connect'), disconnectButton = $('#disconnect'), contentInput = $('#content'), sendButton = $('#send');
    const status = $('#status'), messages = $('#messages'), count = $('#count');
    const timeFormat = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    let socket = null, messageCount = 0, activeReply = null;

    function setState(state, label) {
      status.textContent = label;
      urlInput.disabled = state !== 'closed'; userInput.disabled = state !== 'closed';
      roomInput.disabled = state !== 'closed'; characterInput.disabled = state !== 'closed';
      connectButton.disabled = state !== 'closed';
      disconnectButton.disabled = state !== 'open' && state !== 'connecting';
      contentInput.disabled = state !== 'open';
      sendButton.disabled = state !== 'open' || !contentInput.value.trim();
    }
    function prepareMessages() { messages.querySelector('.empty')?.remove(); }
    function appendNotice(text, error = false) {
      prepareMessages(); const el = document.createElement('p'); el.className = error ? 'notice error' : 'notice'; el.textContent = text; messages.append(el); scrollDown();
    }
    function scrollDown() { messages.scrollTop = messages.scrollHeight; }
    function addMessage({ role, name, content = '', timestamp = new Date().toISOString() }) {
      prepareMessages(); const date = new Date(timestamp);
      const article = document.createElement('article'); article.className = `message ${role}`;
      const meta = document.createElement('div'); meta.className = 'meta';
      const label = document.createElement('span'); label.textContent = name;
      const time = document.createElement('time'); time.dateTime = timestamp; time.textContent = Number.isNaN(date.getTime()) ? '' : timeFormat.format(date);
      const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = content;
      meta.append(label, time); article.append(meta, bubble); messages.append(article); count.textContent = String(++messageCount); scrollDown();
      return bubble;
    }
    function send(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return false;
      socket.send(JSON.stringify(payload)); return true;
    }
    function handleEvent(event) {
      if (!event || typeof event.type !== 'string') throw new Error('无法识别的服务端事件');
      switch (event.type) {
        case 'joined':
          appendNotice(`已加入房间 ${event.room_id}，正在与 ${event.character_id} 对话。`);
          break;
        case 'token':
          if (!activeReply) activeReply = addMessage({ role: 'assistant', name: event.character_id || '角色', timestamp: event.timestamp });
          activeReply.textContent += event.content || ''; scrollDown();
          break;
        case 'done': activeReply = null; break;
        case 'error': activeReply = null; appendNotice(event.content || '服务端处理失败', true); break;
        default: appendNotice(`收到事件：${event.type}`);
      }
    }

    $('#connection-form').addEventListener('submit', (event) => {
      event.preventDefault(); if (socket) return;
      let connection;
      try {
        const url = new URL(urlInput.value.trim());
        if (!['ws:', 'wss:'].includes(url.protocol)) throw new Error('请使用 ws:// 或 wss:// 地址');
        url.searchParams.set('user_id', userInput.value.trim());
        if (!roomInput.value.trim() || !characterInput.value.trim()) throw new Error('房间 ID 和角色 ID 不能为空');
        connection = new WebSocket(url.href);
      } catch (error) { appendNotice(`连接失败：${error.message}`, true); return; }
      socket = connection; setState('connecting', '连接中');
      const timeout = setTimeout(() => { if (socket === connection && connection.readyState === WebSocket.CONNECTING) { appendNotice('连接超时，请检查服务器。', true); socket = null; setState('closed', '连接超时'); connection.close(); } }, 10000);
      connection.addEventListener('open', () => {
        clearTimeout(timeout); if (socket !== connection) return;
        setState('open', '已连接');
        send({ type: 'join', room_id: roomInput.value.trim(), character_id: characterInput.value.trim() });
        contentInput.focus();
      });
      connection.addEventListener('message', (e) => { if (socket !== connection) return; try { handleEvent(JSON.parse(e.data)); } catch (error) { appendNotice(`消息处理失败：${error.message}`, true); } });
      connection.addEventListener('error', () => { if (socket === connection) appendNotice('连接发生错误，请确认服务已启动。', true); });
      connection.addEventListener('close', (e) => { clearTimeout(timeout); if (socket !== connection) return; socket = null; activeReply = null; setState('closed', '已断开'); appendNotice(e.code === 1000 ? '连接已关闭。' : `连接已断开（${e.code}）。`, e.code !== 1000); });
    });
    disconnectButton.addEventListener('click', () => { if (socket) { setState('closing', '断开中'); socket.close(1000, 'user disconnect'); } });
    $('#message-form').addEventListener('submit', (event) => {
      event.preventDefault(); const content = contentInput.value;
      if (!content.trim() || !send({ type: 'chat', content })) return;
      addMessage({ role: 'user', name: userInput.value.trim() || '我', content });
      contentInput.value = ''; sendButton.disabled = true; contentInput.focus();
    });
    contentInput.addEventListener('input', () => { sendButton.disabled = socket?.readyState !== WebSocket.OPEN || !contentInput.value.trim(); });
    contentInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) { event.preventDefault(); $('#message-form').requestSubmit(); }
    });
    $('#clear').addEventListener('click', () => { messages.replaceChildren(); messageCount = 0; count.textContent = '0'; activeReply = null; });
  </script>
</body>
</html>
