<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 客户端测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 700px;
            padding: 30px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .status-dot.disconnected {
            background: #dc3545;
        }

        .status-dot.connecting {
            background: #ffc107;
            animation: pulse 1s infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .status-text .highlight {
            color: #667eea;
            font-weight: 600;
        }

        /* 控制区 */
        .control-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-area input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .control-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-primary:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-success:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-danger:disabled {
            background: #b0b0b0;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        /* 消息区域 */
        .message-area {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 12px;
            background: #fafafa;
            margin-bottom: 12px;
        }

        .message-area::-webkit-scrollbar {
            width: 6px;
        }

        .message-area::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .message-area::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .message-area::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .message-item {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-item.sent {
            background: #667eea;
            color: white;
            text-align: right;
            margin-left: 40px;
        }

        .message-item.received {
            background: white;
            border: 1px solid #e0e0e0;
            margin-right: 40px;
        }

        .message-item.system {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-size: 13px;
            margin: 4px 0;
        }

        .message-item .time {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 8px;
        }

        .message-item.sent .time {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 底部工具栏 */
        .toolbar {
            display: flex;
            gap: 10px;
        }

        .toolbar .btn {
            flex: 1;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .control-area {
                flex-direction: column;
            }

            .message-item.sent {
                margin-left: 20px;
            }

            .message-item.received {
                margin-right: 20px;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .toolbar .btn {
                flex: 1 1 calc(50% - 5px);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>
            💬 WebSocket 客户端
            <span style="font-size: 14px; color: #888; font-weight: normal;">v1.0</span>
        </h1>
        <div class="subtitle">连接地址: ws://localhost:8080/ws</div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="status-dot disconnected" id="statusDot"></span>
            <span class="status-text" id="statusText">
                未连接 — 点击 <span class="highlight">连接</span> 开始
            </span>
        </div>

        <!-- 控制区 -->
        <div class="control-area">
            <input type="text" id="messageInput" placeholder="输入消息..." disabled>
            <button class="btn btn-success" id="sendBtn" disabled>发送</button>
        </div>

        <!-- 消息列表 -->
        <div class="message-area" id="messageArea">
            <div class="message-item system">💡 点击「连接」按钮建立 WebSocket 连接</div>
        </div>

        <!-- 底部工具栏 -->
        <div class="toolbar">
            <button class="btn btn-primary" id="connectBtn">🔗 连接</button>
            <button class="btn btn-danger" id="disconnectBtn" disabled>✖ 断开</button>
            <button class="btn btn-outline" id="clearBtn">🗑 清空</button>
        </div>
    </div>

    <script>
        // ============ DOM 元素 ============
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const messageArea = document.getElementById('messageArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearBtn = document.getElementById('clearBtn');

        // ============ WebSocket 相关 ============
        let ws = null;
        const WS_URL = 'ws://localhost:8080/ws';

        // ============ 工具函数 ============
        function getTime() {
            const now = new Date();
            return now.toTimeString().slice(0, 8);
        }

        function addMessage(content, type = 'system') {
            const div = document.createElement('div');
            div.className = `message-item ${type}`;
            div.innerHTML = `${content} <span class="time">${getTime()}</span>`;
            messageArea.appendChild(div);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function setStatus(state, text) {
            statusDot.className = `status-dot ${state}`;
            statusText.innerHTML = text;
        }

        function setControls(connected) {
            messageInput.disabled = !connected;
            sendBtn.disabled = !connected;
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;

            if (connected) {
                messageInput.focus();
            }
        }

        // ============ WebSocket 核心操作 ============
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                return;
            }

            try {
                ws = new WebSocket(WS_URL);
                setStatus('connecting', '⏳ 正在连接...');
                setControls(false);

                ws.onopen = function () {
                    setStatus('connected', '✅ 已连接 — 可以开始聊天了');
                    setControls(true);
                    addMessage('🟢 连接成功', 'system');
                    // 发送一条测试消息
                    ws.send('Hello, Server! 👋');
                    addMessage('👋 Hello, Server!', 'sent');
                };

                ws.onmessage = function (event) {
                    addMessage(`📩 ${event.data}`, 'received');
                };

                ws.onerror = function (error) {
                    addMessage('❌ 发生错误: ' + (error.message || '未知错误'), 'system');
                    setStatus('disconnected', '❌ 连接错误 — 请重试');
                    setControls(false);
                };

                ws.onclose = function (event) {
                    let reason = '连接已关闭';
                    if (event.wasClean) {
                        reason = `正常关闭 (代码: ${event.code})`;
                    } else {
                        reason = `异常断开 (代码: ${event.code})`;
                    }
                    addMessage(`🔴 ${reason}`, 'system');
                    setStatus('disconnected', `⛔ ${reason} — 点击「连接」重试`);
                    setControls(false);
                    ws = null;
                };

            } catch (e) {
                addMessage(`❌ 创建连接失败: ${e.message}`, 'system');
                setStatus('disconnected', '❌ 连接失败 — 请检查服务端是否启动');
                setControls(false);
            }
        }

        function disconnect() {
            if (ws) {
                // 发送关闭帧，优雅关闭
                ws.close(1000, '用户主动断开');
                // 立即更新 UI，等待 onclose 回调处理剩余状态
                setStatus('disconnected', '⛔ 正在断开...');
                setControls(false);
                addMessage('🔌 正在断开连接...', 'system');
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) {
                addMessage('⚠️ 消息不能为空', 'system');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('❌ 未连接到服务器', 'system');
                return;
            }

            try {
                ws.send(text);
                addMessage(`✉️ ${text}`, 'sent');
                messageInput.value = '';
                messageInput.focus();
            } catch (e) {
                addMessage(`❌ 发送失败: ${e.message}`, 'system');
            }
        }

        // ============ 事件绑定 ============
        connectBtn.addEventListener('click', connect);

        disconnectBtn.addEventListener('click', disconnect);

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        clearBtn.addEventListener('click', function () {
            messageArea.innerHTML = '';
            addMessage('🗑 消息已清空', 'system');
        });

        // ============ 页面关闭时主动断开 ============
        window.addEventListener('beforeunload', function () {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close(1000, '页面关闭');
            }
        });

        // ============ 控制台提示 ============
        console.log('%c WebSocket 客户端已加载 ', 'background: #667eea; color: white; padding: 8px 16px; border-radius: 4px;');
        console.log(`服务端地址: ${WS_URL}`);
        console.log('提示: 请先启动 Go 服务端 (go run main.go)');
    </script>

</body>

</html>
